name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web files
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx capacitor-assets generate --android --iconBackgroundColor '#231F20' --iconBackgroundColorDark '#231F20'

      - name: Add permissions and portrait mode
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' $M || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $M
          grep -q 'screenOrientation' $M || \
            sed -i '0,/<activity/s#<activity#<activity android:screenOrientation="portrait"#' $M

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snap-mudhakkir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
